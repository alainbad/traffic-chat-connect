<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Banana Kong — Super Advanced</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#060a14;color:#b0bcd8;font-family:'Rajdhani',sans-serif;font-weight:500;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none}
#game-wrapper{width:900px;max-width:100vw}
#header{display:grid;grid-template-columns:1fr 200px 1fr;background:linear-gradient(180deg,#0d1428 0%,#0a1020 100%);border:1px solid rgba(50,80,180,0.25);border-bottom:2px solid rgba(80,120,220,0.18);border-radius:10px 10px 0 0;min-height:60px;overflow:hidden}
.player-info{padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#p1info{border-right:1px solid rgba(50,80,180,0.2)}
#p2info{border-left:1px solid rgba(50,80,180,0.2);align-items:flex-end;text-align:right}
.player-name{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
#p1info .player-name{color:#e06428}
#p2info .player-name{color:#2878e0}
.player-hearts{display:flex;gap:5px;font-size:18px;line-height:1}
#p2info .player-hearts{flex-direction:row-reverse}
.heart{transition:all 0.3s;filter:drop-shadow(0 0 4px rgba(255,60,60,0.6))}
.heart.lost{opacity:0.14;filter:none}
.heart.flash{animation:heartFlash 0.4s ease-out}
@keyframes heartFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
.player-wins{display:flex;gap:5px}
#p2info .player-wins{flex-direction:row-reverse}
.win-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);transition:all 0.3s}
.win-dot.filled{background:#c89028;border-color:#f0c060;box-shadow:0 0 7px rgba(200,144,40,0.65)}
#title-block{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px;background:linear-gradient(180deg,rgba(200,144,40,0.07) 0%,transparent 100%)}
#title-block h1{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:#c89028;letter-spacing:5px;text-shadow:0 0 18px rgba(200,144,40,0.5);text-transform:uppercase}
#round-info{font-size:10px;color:rgba(176,188,216,0.5);letter-spacing:2px;text-transform:uppercase}
#wind-info{font-size:11px;color:#70b8d8;letter-spacing:1px}
#canvas-container{position:relative;width:900px;max-width:100vw;overflow:hidden;border-left:1px solid rgba(50,80,180,0.25);border-right:1px solid rgba(50,80,180,0.25)}
canvas{display:block;width:100%}
#controls{background:linear-gradient(180deg,#0a0e20 0%,#07091a 100%);border:1px solid rgba(50,80,180,0.25);border-top:1px solid rgba(50,80,180,0.12);border-radius:0 0 10px 10px;padding:10px 14px 8px;display:flex;flex-direction:column;gap:7px}
#turn-line{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(176,188,216,0.45);transition:color 0.3s}
#turn-line.p1{color:#e06428}
#turn-line.p2{color:#2878e0}
#ctrl-row{display:flex;align-items:center;gap:10px}
#weapons{display:flex;gap:5px;flex-shrink:0}
.weapon-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 7px;cursor:pointer;color:#8090b8;font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s;min-width:52px}
.weapon-btn:hover:not(:disabled){background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.22);color:#b0bcd8}
.weapon-btn.selected{background:rgba(200,144,40,0.12);border-color:rgba(200,144,40,0.65);color:#f0c060;box-shadow:0 0 12px rgba(200,144,40,0.2)}
.weapon-btn:disabled{opacity:0.28;cursor:not-allowed}
.weapon-btn .wico{font-size:17px;line-height:1}
.weapon-btn .wlabel{font-size:9px;letter-spacing:1px;opacity:0.75}
.weapon-btn span.ammo{font-family:'Orbitron',sans-serif;font-size:9px;color:rgba(255,255,255,0.35)}
.weapon-btn.selected span.ammo{color:#c89028}
.ctrl-sep{width:1px;height:38px;background:rgba(255,255,255,0.07);flex-shrink:0}
.ctrl-group{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ctrl-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(176,188,216,0.38)}
.ctrl-row{display:flex;align-items:center;gap:7px}
.ctrl-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:#f0c060;min-width:40px;text-align:right}
input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#c89028;box-shadow:0 0 8px rgba(200,144,40,0.65);cursor:pointer;border:2px solid #f0c060}
#throw-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
#throw-btn{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;padding:10px 24px;background:linear-gradient(135deg,#b87820,#8a5010);border:1.5px solid #c89028;border-radius:8px;color:#ffd878;cursor:pointer;text-transform:uppercase;box-shadow:0 0 16px rgba(200,144,40,0.25),inset 0 1px 0 rgba(255,255,255,0.15);transition:all 0.15s;white-space:nowrap}
#throw-btn:hover:not(:disabled){background:linear-gradient(135deg,#c88828,#9a6020);box-shadow:0 0 28px rgba(200,144,40,0.5),inset 0 1px 0 rgba(255,255,255,0.15);transform:translateY(-1px)}
#throw-btn:active{transform:translateY(0)}
#throw-btn:disabled{opacity:0.38;cursor:not-allowed;transform:none}
#timer-display{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:rgba(176,188,216,0.55);min-width:42px;text-align:center;letter-spacing:1px}
#timer-display.urgent{color:#e82828;animation:timerPulse 0.5s ease-in-out infinite;text-shadow:0 0 14px rgba(232,40,40,0.6)}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.38}}
#traj-btn{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;padding:7px 11px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:7px;color:rgba(176,188,216,0.4);cursor:pointer;text-transform:uppercase;transition:all 0.15s;white-space:nowrap;flex-shrink:0}
#traj-btn.active{background:rgba(80,180,255,0.08);border-color:rgba(80,180,255,0.4);color:#70c0f8}
#message{text-align:center;font-size:12px;color:rgba(176,188,216,0.45);letter-spacing:1px;min-height:16px;padding-top:1px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
#overlay.show{display:flex}
.overlay-box{background:linear-gradient(160deg,#0d1830 0%,#070c1a 100%);border:2px solid rgba(200,144,40,0.4);border-radius:16px;padding:36px 52px;text-align:center;max-width:420px;box-shadow:0 0 60px rgba(200,144,40,0.15),0 20px 60px rgba(0,0,0,0.6);position:relative;overflow:hidden}
.overlay-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(200,144,40,0.07) 0%,transparent 60%);pointer-events:none}
.overlay-box h2{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:#c89028;text-shadow:0 0 20px rgba(200,144,40,0.5);margin-bottom:10px;letter-spacing:3px}
.overlay-box p{font-size:15px;color:#8090b8;margin-bottom:22px;letter-spacing:1px}
.overlay-box button{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;padding:11px 28px;background:linear-gradient(135deg,#b87820,#8a5010);border:1.5px solid #c89028;border-radius:8px;color:#ffd878;cursor:pointer;text-transform:uppercase;transition:all 0.15s;box-shadow:0 0 16px rgba(200,144,40,0.2)}
.overlay-box button:hover{background:linear-gradient(135deg,#c88828,#9a6020);box-shadow:0 0 28px rgba(200,144,40,0.4);transform:translateY(-1px)}
.score-display{font-family:'Orbitron',sans-serif;font-size:22px;color:#f0c060;margin-bottom:16px;letter-spacing:2px}
@media(max-width:900px){
  #game-wrapper,#canvas-container{width:100vw}
  #controls{padding:8px 10px}
  input[type=range]{min-width:50px}
  #title-block h1{font-size:12px;letter-spacing:3px}
  .weapon-btn{min-width:44px;padding:4px 5px}
  #throw-btn{padding:8px 14px;font-size:11px}
}
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="header">
    <div class="player-info" id="p1info">
      <div class="player-name">Player 1</div>
      <div class="player-hearts" id="p1hearts"></div>
      <div class="player-wins" id="p1wins"></div>
    </div>
    <div id="title-block">
      <h1>Banana Kong</h1>
      <div id="round-info">Round 1 of 5</div>
      <div id="wind-info">Wind: calm</div>
    </div>
    <div class="player-info" id="p2info">
      <div class="player-name">Player 2</div>
      <div class="player-hearts" id="p2hearts"></div>
      <div class="player-wins" id="p2wins"></div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="900" height="460"></canvas>
  </div>

  <div id="controls">
    <div id="turn-line" class="p1">Player 1's Turn</div>
    <div id="ctrl-row">
      <div id="weapons">
        <button class="weapon-btn selected" id="wbtn0" onclick="selectWeapon(0)">
          <span class="wico">🍌</span>
          <span class="wlabel">Banana</span>
          <span class="ammo">∞</span>
        </button>
        <button class="weapon-btn" id="wbtn1" onclick="selectWeapon(1)">
          <span class="wico">💥</span>
          <span class="wlabel">Cluster</span>
          <span class="ammo" id="wammo1">2</span>
        </button>
        <button class="weapon-btn" id="wbtn2" onclick="selectWeapon(2)">
          <span class="wico">☄️</span>
          <span class="wlabel">Nuke</span>
          <span class="ammo" id="wammo2">1</span>
        </button>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <div class="ctrl-label">Angle</div>
        <div class="ctrl-row">
          <input type="range" id="angleSlider" min="5" max="175" value="45" oninput="updateControls()">
          <span class="ctrl-val" id="angleVal">45°</span>
        </div>
      </div>
      <div class="ctrl-sep"></div>
      <div id="throw-col">
        <button id="throw-btn" onclick="throwBanana()">THROW</button>
        <div id="timer-display">20s</div>
      </div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-group">
        <div class="ctrl-label">Power</div>
        <div class="ctrl-row">
          <span class="ctrl-val" id="powerVal">70%</span>
          <input type="range" id="powerSlider" min="10" max="100" value="70" oninput="updateControls()">
        </div>
      </div>
      <div class="ctrl-sep"></div>
      <button id="traj-btn" class="active" onclick="toggleTrajectory()">◎ Traj</button>
    </div>
    <div id="message">Player 1's turn — select weapon and throw!</div>
  </div>
</div>

<div id="overlay">
  <div class="overlay-box" id="overlayBox">
    <h2 id="overlayTitle">Round Over!</h2>
    <div class="score-display" id="overlayScore"></div>
    <p id="overlayMsg"></p>
    <button onclick="nextRound()">Next Round</button>
  </div>
</div>

<script>
const W = 900, H = 460, GY = H - 38;
const GRAVITY = 0.055;
const NUM_BLDGS = 11;
const MAX_ROUND_WINS = 3;
const TOTAL_ROUNDS = 5;

const WEAPONS = [
  { id:0, name:'Banana',  emoji:'🍌', splashR:22,  damage:1, speedMult:1.0,  ammo:Infinity },
  { id:1, name:'Cluster', emoji:'💥', splashR:16,  damage:1, speedMult:1.1,  ammo:2, clusterCount:3 },
  { id:2, name:'Nuke',    emoji:'☄️', splashR:60,  damage:2, speedMult:0.85, ammo:1, nukeScale:3.5 },
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playThrow() {
  try {
    const ac = getAudio(); if (!ac) return;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(80, ac.currentTime + 0.4);
    g.gain.setValueAtTime(0.15, ac.currentTime);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.4);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.4);
  } catch(e) {}
}

function playExplosion(isNuke) {
  try {
    const ac = getAudio(); if (!ac) return;
    const bufSize = ac.sampleRate * (isNuke ? 0.9 : 0.5);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = isNuke ? 180 : 320;
    const g = ac.createGain();
    g.gain.setValueAtTime(isNuke ? 0.6 : 0.4, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (isNuke ? 0.9 : 0.5));
    src.connect(filter); filter.connect(g); g.connect(ac.destination);
    src.start(); src.stop(ac.currentTime + (isNuke ? 0.9 : 0.5));
  } catch(e) {}
}

function playHit() {
  try {
    const ac = getAudio(); if (!ac) return;
    const bufSize = Math.floor(ac.sampleRate * 0.12);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
    const src = ac.createBufferSource();
    src.buffer = buf;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.5, ac.currentTime);
    src.connect(g); g.connect(ac.destination);
    src.start();
  } catch(e) {}
}

function playMiss() {
  try {
    const ac = getAudio(); if (!ac) return;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(110, ac.currentTime + 0.3);
    g.gain.setValueAtTime(0.1, ac.currentTime);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.3);
  } catch(e) {}
}

function playBeep() {
  try {
    const ac = getAudio(); if (!ac) return;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0.08, ac.currentTime);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.08);
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.08);
  } catch(e) {}
}

// ---- State ----
let state = {};

function initState() {
  state = {
    buildings: [],
    gorillas: [{x:0,y:0},{x:0,y:0}],
    current: 0,
    scores: [0, 0],
    wind: 0,
    banana: null,
    clusterBananas: [],
    particles: [],
    stars: [],
    hitPlayer: -1,
    phase: 'input',
    hp: [3, 3],
    ammo: [[Infinity, 2, 1], [Infinity, 2, 1]],
    selectedWeapon: [0, 0],
    roundWins: [0, 0],
    round: 1,
    timer: 20,
    timerActive: false,
    timerInterval: null,
    camera: { shakeX:0, shakeY:0, shakeTimer:0, shakeIntensity:0, shakeDuration:1 },
    windParticles: [],
    shockwaves: [],
    hitFlash: null,
    showTrajectory: true,
    screenFlash: 0,
    frame: 0,
  };
  state.stars = Array.from({length:80}, () => ({
    x: Math.random()*W, y: Math.random()*(H*0.7),
    r: Math.random()*1.4+0.4, blink: Math.random()*Math.PI*2
  }));
  generateBuildings();
  spawnWindParticles();
  newWind();
  updateHUD();
}

function newWind() {
  state.wind = (Math.random() - 0.5) * 10;
  document.getElementById('wind-info').textContent =
    `Wind: ${state.wind === 0 ? 'calm' : (state.wind > 0 ? '→ ' : '← ') + Math.abs(state.wind).toFixed(1)}`;
}

function generateBuildings() {
  state.buildings = [];
  const totalW = W;
  const avgW = totalW / NUM_BLDGS;
  let x = 0;
  for (let i = 0; i < NUM_BLDGS; i++) {
    const w = Math.floor(avgW * 0.7 + Math.random() * avgW * 0.6);
    const minH = 80, maxH = H - GY + 10 + (H * 0.55);
    const h = Math.floor(minH + Math.random() * (maxH - minH));
    const type = i % 3; // 0=glass, 1=concrete, 2=brick
    const bx = x + Math.floor((avgW - w) / 2);
    const by = GY - h;
    const wins = generateWindows(type, w, h);
    const roofFeatures = generateRoofFeatures(w, by);
    state.buildings.push({ x: bx, y: by, w, h, type, wins, roofFeatures, damages: [] });
    x += avgW;
  }
  // Place gorillas on 2nd and 10th buildings (or similar spread)
  const b0 = state.buildings[1];
  const b1 = state.buildings[9];
  state.gorillas[0] = { x: b0.x + b0.w/2, y: b0.y };
  state.gorillas[1] = { x: b1.x + b1.w/2, y: b1.y };
}

function generateWindows(type, w, h) {
  const wins = [];
  if (type === 0) { // glass curtain wall - horizontal bands
    const bandH = 14, gap = 6;
    for (let y = 10; y < h - 10; y += bandH + gap) {
      wins.push({ bx: 4, by: y, bw: w - 8, bh: bandH,
        lit: Math.random() > 0.3, litColor: `hsl(${40 + Math.random()*30},80%,70%)` });
    }
  } else if (type === 1) { // concrete grid windows
    const cols = Math.floor((w - 10) / 20), rows = Math.floor((h - 10) / 22);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        wins.push({ bx: 8 + c*20, by: 8 + r*22, bw: 10, bh: 12,
          lit: Math.random() > 0.5, litColor: `hsl(${200 + Math.random()*40},60%,70%)` });
      }
    }
  } else { // brick - arch windows
    const cols = Math.max(1, Math.floor(w / 28)), rows = Math.floor((h - 10) / 30);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        wins.push({ bx: 6 + c*28, by: 8 + r*30, bw: 14, bh: 18, arch: true,
          lit: Math.random() > 0.4, litColor: `hsl(${30 + Math.random()*20},70%,60%)` });
      }
    }
  }
  return wins;
}

function generateRoofFeatures(w, by) {
  const features = [];
  if (Math.random() > 0.5) {
    features.push({ type: 'tower', x: w/2 - 4, y: -18, w: 8, h: 18 });
  }
  if (Math.random() > 0.6) {
    features.push({ type: 'antenna', x: w/2 + (Math.random()-0.5)*20, y: -28, h: 28 });
  }
  for (let i = 0; i < Math.floor(Math.random()*3); i++) {
    features.push({ type: 'vent', x: 8 + Math.random()*(w-24), y: -8, w: 12, h: 8 });
  }
  return features;
}

function spawnWindParticles() {
  state.windParticles = [];
  for (let i = 0; i < 25; i++) {
    state.windParticles.push(newWindParticle(true));
  }
}

function newWindParticle(randomX) {
  return {
    x: randomX ? Math.random()*W : (state.wind >= 0 ? -20 : W+20),
    y: Math.random()*(H*0.72),
    len: 10 + Math.random()*20,
    speed: (1 + Math.random()*2) * Math.sign(state.wind || 1),
    alpha: 0.1 + Math.random()*0.2,
  };
}

function triggerShake(intensity, duration) {
  if (intensity > state.camera.shakeIntensity || state.camera.shakeTimer < 5) {
    state.camera.shakeIntensity = intensity;
    state.camera.shakeDuration = duration;
    state.camera.shakeTimer = duration;
  }
}

function generateJagged(n) {
  return Array.from({length:n}, () => 0.58 + Math.random()*0.42);
}

function generateCracks(r, n) {
  return Array.from({length:n}, () => {
    const a = Math.random()*Math.PI*2;
    const len = r * (0.8 + Math.random()*0.6);
    const pts = [];
    let cx = 0, cy = 0;
    for (let i = 0; i < 4; i++) {
      cx += Math.cos(a + (Math.random()-0.5)*0.5) * (len/3);
      cy += Math.sin(a + (Math.random()-0.5)*0.5) * (len/3);
      pts.push({x:cx, y:cy});
    }
    return pts;
  });
}

function generateScorches(r) {
  return Array.from({length:5}, () => ({
    ox: (Math.random()-0.5)*r*0.8,
    oy: (Math.random()-0.5)*r*0.8,
    r: r*0.15 + Math.random()*r*0.2,
  }));
}

function isInsideHole(bld, px, py) {
  for (const dmg of bld.damages) {
    const dx = px - dmg.x, dy = py - dmg.y;
    if (dx*dx + dy*dy < (dmg.r * 0.88) * (dmg.r * 0.88)) return true;
  }
  return false;
}

function applyBuildingDamage(bld, hitX, hitY, splashR) {
  const r = splashR || 22;
  for (const dmg of bld.damages) {
    const dx = hitX - dmg.x, dy = hitY - dmg.y;
    if (Math.sqrt(dx*dx+dy*dy) < dmg.r * 1.1) {
      dmg.r = Math.min(dmg.r * 1.28 + 16, 90);
      dmg.hits++;
      dmg.cracks = generateCracks(dmg.r, 6+dmg.hits);
      dmg.scorches = generateScorches(dmg.r);
      return dmg;
    }
  }
  const newDmg = {
    x: hitX, y: hitY, r: Math.min(r, 48),
    hits: 1,
    jagged: generateJagged(16),
    cracks: generateCracks(r, 5),
    scorches: generateScorches(r),
  };
  bld.damages.push(newDmg);
  return newDmg;
}

function createExplosion(x, y, scale, nuke) {
  scale = scale || 1;
  const n = Math.floor((nuke ? 80 : 40) * scale);
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2;
    const spd = (1 + Math.random()*4) * scale;
    const kind = Math.random() < 0.4 ? 'fire' : Math.random() < 0.5 ? 'smoke' : Math.random() < 0.5 ? 'debris' : 'flash';
    state.particles.push({
      x, y,
      vx: Math.cos(a)*spd + (Math.random()-0.5),
      vy: Math.sin(a)*spd - Math.random()*2,
      life: 0.8 + Math.random()*0.4,
      maxLife: 0.8 + Math.random()*0.4,
      r: (2 + Math.random()*4) * scale,
      kind,
      color: kind === 'debris' ? `hsl(${20+Math.random()*30},60%,${30+Math.random()*20}%)` : null,
    });
  }
  // Shockwaves
  const nRings = nuke ? 3 : 2;
  for (let i = 0; i < nRings; i++) {
    state.shockwaves.push({ x, y, r:4, maxR: (nuke?160:70)*scale*(0.8+i*0.4), speed:(3+i)*scale, alpha:0.8-i*0.15 });
  }
}

function emitDamageSmoke() {
  if (state.frame % 3 !== 0) return;
  for (const bld of state.buildings) {
    for (const dmg of bld.damages) {
      if (Math.random() < 0.4 && dmg.hits > 0) {
        state.particles.push({
          x: dmg.x + (Math.random()-0.5)*dmg.r*0.5,
          y: dmg.y - dmg.r*0.3,
          vx: (Math.random()-0.5)*0.3,
          vy: -(0.3 + Math.random()*0.4),
          life: 1, maxLife: 1,
          r: 3 + Math.random()*4,
          kind: 'smoke',
        });
      }
    }
  }
}

function updateParticles() {
  state.particles = state.particles.filter(p => p.life > 0);
  for (const p of state.particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.kind === 'fire') { p.vy -= 0.05; p.r *= 0.97; }
    if (p.kind === 'smoke') { p.r *= 1.01; p.vx *= 0.98; p.vy *= 0.98; }
    if (p.kind === 'debris') { p.vy += 0.12; p.vx *= 0.99; }
    p.life -= 0.03;
  }
  state.shockwaves = state.shockwaves.filter(sw => sw.r < sw.maxR);
  for (const sw of state.shockwaves) {
    sw.r += sw.speed;
    sw.alpha *= 0.92;
  }
}

function getTrajectoryPoints() {
  const angle = parseInt(document.getElementById('angleSlider').value);
  const power = parseInt(document.getElementById('powerSlider').value);
  const wIdx = state.selectedWeapon[state.current];
  const weapon = WEAPONS[wIdx];
  const gor = state.gorillas[state.current];
  const spd = (power / 100) * 15 * weapon.speedMult;
  const rad = angle * Math.PI / 180;
  const dir = state.current === 0 ? 1 : -1;
  let vx = Math.cos(rad) * spd * dir;
  let vy = -Math.sin(rad) * spd;
  let bx = gor.x + dir * 15;
  let by = gor.y - 30;
  const pts = [];
  for (let i = 0; i < 400; i++) {
    pts.push({x:bx, y:by});
    vx += state.wind * 0.0018;
    vy += GRAVITY;
    bx += vx; by += vy;
    if (bx < 0 || bx > W || by > GY) break;
    // stop if hits solid building
    for (const bld of state.buildings) {
      if (bx >= bld.x && bx <= bld.x+bld.w && by >= bld.y && by <= bld.y+bld.h) {
        if (!isInsideHole(bld, bx, by)) { pts.push({x:bx,y:by}); return pts; }
      }
    }
  }
  return pts;
}

function throwBanana() {
  if (state.phase !== 'input') return;
  getAudio(); // init audio
  const angle = parseInt(document.getElementById('angleSlider').value);
  const power = parseInt(document.getElementById('powerSlider').value);
  const wIdx = state.selectedWeapon[state.current];
  const weapon = WEAPONS[wIdx];

  if (weapon.ammo !== Infinity && state.ammo[state.current][wIdx] <= 0) {
    document.getElementById('message').textContent = 'No ammo for that weapon!';
    return;
  }
  if (weapon.ammo !== Infinity) {
    state.ammo[state.current][wIdx]--;
    updateAmmoDisplay();
  }

  const gor = state.gorillas[state.current];
  const spd = (power / 100) * 15 * weapon.speedMult;
  const rad = angle * Math.PI / 180;
  const dir = state.current === 0 ? 1 : -1;
  state.banana = {
    x: gor.x + dir * 15,
    y: gor.y - 30,
    vx: Math.cos(rad) * spd * dir,
    vy: -Math.sin(rad) * spd,
    rot: 0, trail: [],
    weaponIdx: wIdx,
    weapon,
  };
  state.phase = 'flying';
  state.clusterBananas = [];
  stopTimer();
  playThrow();
  document.getElementById('throw-btn').disabled = true;
}

function updateBanana() {
  if (!state.banana) return;
  const b = state.banana;
  b.trail.push({x:b.x, y:b.y});
  if (b.trail.length > 30) b.trail.shift();

  b.vx += state.wind * 0.0018;
  b.vy += GRAVITY;
  b.x += b.vx;
  b.y += b.vy;
  b.rot += 0.18;

  // Off-screen
  if (b.x < -20 || b.x > W+20 || b.y > H+20) {
    endFlight(false);
    return;
  }

  // Ground
  if (b.y >= GY) {
    createExplosion(b.x, GY, b.weapon.id === 2 ? 2.5 : 1, b.weapon.id === 2);
    if (b.weapon.id === 2) triggerShake(15, 25);
    else triggerShake(5, 10);
    playExplosion(b.weapon.id === 2);
    endFlight(false);
    return;
  }

  // Gorilla collision
  for (let gi = 0; gi < 2; gi++) {
    if (gi === state.current) continue; // skip self
    const gor = state.gorillas[gi];
    const dx = b.x - gor.x, dy = b.y - (gor.y - 25);
    const splashR = b.weapon.splashR * (b.weapon.id === 2 ? 2 : 1);
    if (dx*dx + dy*dy < splashR * splashR) {
      hitGorilla(gi, b.x, b.y, b.weapon);
      return;
    }
  }

  // Building collision
  for (const bld of state.buildings) {
    if (b.x >= bld.x && b.x <= bld.x+bld.w && b.y >= bld.y && b.y <= bld.y+bld.h) {
      if (!isInsideHole(bld, b.x, b.y)) {
        const dmg = applyBuildingDamage(bld, b.x, b.y, b.weapon.splashR);
        const scale = b.weapon.id === 2 ? 2.5 : (dmg.r / 28);
        createExplosion(b.x, b.y, scale, b.weapon.id === 2);
        playExplosion(b.weapon.id === 2);
        if (b.weapon.id === 2) triggerShake(15, 25);
        else triggerShake(4, 8);
        if (b.weapon.id === 1) {
          spawnClusterBananas(b.x, b.y);
        }
        endFlight(false);
        return;
      }
    }
  }
}

function spawnClusterBananas(bx, by) {
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2 - Math.PI / 2;
    const speed = 3 + Math.random() * 2;
    state.clusterBananas.push({
      x: bx, y: by,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      rot: 0, trail: [],
      splashR: 14, life: 180,
    });
  }
}

function updateClusterBananas() {
  for (let i = state.clusterBananas.length - 1; i >= 0; i--) {
    const b = state.clusterBananas[i];
    b.trail.push({x:b.x, y:b.y});
    if (b.trail.length > 15) b.trail.shift();
    b.vx += state.wind * 0.0009;
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;
    b.rot += 0.2;
    b.life--;

    if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y > H+20) {
      state.clusterBananas.splice(i, 1);
      continue;
    }
    if (b.y >= GY) {
      createExplosion(b.x, GY, 0.5);
      state.clusterBananas.splice(i, 1);
      continue;
    }

    // Gorilla hit
    let hit = false;
    for (let gi = 0; gi < 2; gi++) {
      if (gi === state.current) continue;
      const gor = state.gorillas[gi];
      const dx = b.x - gor.x, dy = b.y - (gor.y - 25);
      if (dx*dx + dy*dy < b.splashR * b.splashR) {
        hitGorilla(gi, b.x, b.y, WEAPONS[1]);
        state.clusterBananas.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (hit) continue;

    // Building hit
    for (const bld of state.buildings) {
      if (b.x >= bld.x && b.x <= bld.x+bld.w && b.y >= bld.y && b.y <= bld.y+bld.h) {
        if (!isInsideHole(bld, b.x, b.y)) {
          applyBuildingDamage(bld, b.x, b.y, 14);
          createExplosion(b.x, b.y, 0.5);
          triggerShake(2, 5);
          state.clusterBananas.splice(i, 1);
          hit = true;
          break;
        }
      }
    }
  }
}

function endFlight(hit) {
  state.banana = null;
  if (state.clusterBananas.length === 0) {
    if (state.phase === 'flying') {
      state.phase = 'input';
      if (!hit) {
        setTimeout(() => {
          playMiss();
          missTurn();
        }, 400);
      }
    }
  }
}

function hitGorilla(victimIdx, bx, by, weapon) {
  state.hp[victimIdx] -= weapon.damage;
  state.hp[victimIdx] = Math.max(0, state.hp[victimIdx]);
  state.hitFlash = { playerIdx: victimIdx, timer: 20 };
  playHit();
  createExplosion(bx, by, weapon.id === 2 ? 2.5 : 1.5, weapon.id === 2);
  if (weapon.id === 2) {
    state.screenFlash = 1.0;
    triggerShake(15, 25);
    playExplosion(true);
  } else {
    state.screenFlash = 0.6;
    triggerShake(8, 15);
    playExplosion(false);
  }

  state.banana = null;
  state.clusterBananas = [];

  if (state.hp[victimIdx] <= 0) {
    // Round over
    const winner = victimIdx === 0 ? 1 : 0;
    state.roundWins[winner]++;
    state.hitPlayer = victimIdx;
    state.phase = 'exploding';
    updateHUD();
    setTimeout(() => showRoundOverlay(winner), 900);
  } else {
    // Continue, switch turns
    state.phase = 'input';
    updateHUD();
    setTimeout(() => missTurn(), 300);
  }
}

function missTurn() {
  state.current = 1 - state.current;
  newWind();
  updateHUD();
  startTimer();
  updateMessage();
  document.getElementById('throw-btn').disabled = false;
}

function startTimer() {
  stopTimer();
  state.timer = 20;
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timer--;
    updateTimerDisplay();
    if (state.timer <= 5 && state.timer > 0) playBeep();
    if (state.timer <= 0) {
      stopTimer();
      autoThrow();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function autoThrow() {
  throwBanana();
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-display');
  el.textContent = state.timer + 's';
  el.className = state.timer <= 5 ? 'urgent' : '';
}

function selectWeapon(idx) {
  const cur = state.current;
  if (idx > 0 && state.ammo[cur][idx] <= 0) return;
  state.selectedWeapon[cur] = idx;
  for (let i = 0; i < 3; i++) {
    document.getElementById('wbtn'+i).classList.toggle('selected', i === idx);
  }
}

function updateAmmoDisplay() {
  for (let i = 1; i < 3; i++) {
    const el = document.getElementById('wammo'+i);
    if (el) {
      const a = Math.min(state.ammo[0][i], state.ammo[1][i]);
      el.textContent = state.ammo[state.current][i];
    }
  }
  const cur = state.current;
  for (let i = 0; i < 3; i++) {
    const btn = document.getElementById('wbtn'+i);
    if (i > 0) btn.disabled = state.ammo[cur][i] <= 0;
  }
  // Update ammo display for current player
  document.getElementById('wammo1').textContent = state.ammo[cur][1];
  document.getElementById('wammo2').textContent = state.ammo[cur][2];
}

function toggleTrajectory() {
  state.showTrajectory = !state.showTrajectory;
  const btn = document.getElementById('traj-btn');
  btn.classList.toggle('active', state.showTrajectory);
}

function updateControls() {
  document.getElementById('angleVal').textContent = document.getElementById('angleSlider').value + '°';
  document.getElementById('powerVal').textContent = document.getElementById('powerSlider').value + '%';
}

function updateMessage() {
  const names = ['Player 1', 'Player 2'];
  const wName = WEAPONS[state.selectedWeapon[state.current]].emoji + ' ' + WEAPONS[state.selectedWeapon[state.current]].name;
  document.getElementById('message').textContent =
    `${names[state.current]}'s turn — ${wName} selected`;
}

function updateHUD() {
  // Round
  document.getElementById('round-info').textContent = `Round ${state.round} of ${TOTAL_ROUNDS}`;

  // Player wins
  for (let p = 0; p < 2; p++) {
    const el = document.getElementById(`p${p+1}wins`);
    el.innerHTML = '';
    for (let i = 0; i < MAX_ROUND_WINS; i++) {
      const dot = document.createElement('div');
      dot.className = 'win-dot' + (i < state.roundWins[p] ? ' filled' : '');
      el.appendChild(dot);
    }
  }

  // HP hearts
  for (let p = 0; p < 2; p++) {
    const el = document.getElementById(`p${p+1}hearts`);
    el.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart' + (i >= state.hp[p] ? ' lost' : '');
      heart.textContent = '❤';
      el.appendChild(heart);
    }
  }

  updateAmmoDisplay();

  // Turn indicator
  const tl = document.getElementById('turn-line');
  if (tl && state.phase === 'input') {
    tl.textContent = `Player ${state.current + 1}'s Turn`;
    tl.className = state.current === 0 ? 'p1' : 'p2';
  }
}

function showRoundOverlay(winner) {
  const names = ['Player 1', 'Player 2'];
  const overlay = document.getElementById('overlay');
  const btn = overlay.querySelector('button');
  document.getElementById('overlayTitle').textContent = `${names[winner]} wins the round!`;
  document.getElementById('overlayScore').textContent =
    `Scores: P1 ${state.roundWins[0]} – ${state.roundWins[1]} P2`;

  if (state.roundWins[winner] >= MAX_ROUND_WINS) {
    document.getElementById('overlayMsg').textContent =
      `${names[winner]} wins the MATCH! 🏆`;
    btn.textContent = 'New Game';
    btn.onclick = newGame;
  } else {
    document.getElementById('overlayMsg').textContent =
      `First to ${MAX_ROUND_WINS} wins takes the match!`;
    btn.textContent = 'Next Round';
    btn.onclick = nextRound;
  }
  overlay.classList.add('show');
}

function nextRound() {
  document.getElementById('overlay').classList.remove('show');
  state.round++;
  if (state.round > TOTAL_ROUNDS) {
    // Shouldn't normally reach here if we check roundWins, but just in case
    newGame();
    return;
  }
  state.hp = [3, 3];
  state.ammo = [[Infinity, 2, 1], [Infinity, 2, 1]];
  state.selectedWeapon = [0, 0];
  state.banana = null;
  state.clusterBananas = [];
  state.particles = [];
  state.phase = 'input';
  state.hitPlayer = -1;
  state.hitFlash = null;
  state.screenFlash = 0;
  state.shockwaves = [];
  generateBuildings();
  newWind();
  spawnWindParticles();
  updateHUD();
  for (let i = 0; i < 3; i++) {
    document.getElementById('wbtn'+i).classList.toggle('selected', i === 0);
    if (i > 0) document.getElementById('wbtn'+i).disabled = false;
  }
  document.getElementById('throw-btn').disabled = false;
  startTimer();
  updateMessage();
}

function newGame() {
  document.getElementById('overlay').classList.remove('show');
  stopTimer();
  initState();
  for (let i = 0; i < 3; i++) {
    document.getElementById('wbtn'+i).classList.toggle('selected', i === 0);
    if (i > 0) document.getElementById('wbtn'+i).disabled = false;
  }
  document.getElementById('throw-btn').disabled = false;
  startTimer();
  updateMessage();
}

// ---- DRAWING ----

function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#060412');
  grad.addColorStop(0.5, '#0a0820');
  grad.addColorStop(1, '#12103a');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // City glow at horizon
  const glow = ctx.createRadialGradient(W/2, GY, 10, W/2, GY, W*0.7);
  glow.addColorStop(0, 'rgba(80,40,120,0.25)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, GY-80, W, 100);

  // Stars
  for (const s of state.stars) {
    const brightness = 0.6 + 0.4 * Math.sin(s.blink + state.frame * 0.04);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * brightness, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${brightness * 0.8})`;
    ctx.fill();
  }

  // Moon
  ctx.save();
  ctx.beginPath();
  ctx.arc(W*0.85, 55, 32, 0, Math.PI*2);
  const moonGrad = ctx.createRadialGradient(W*0.85-8, 47, 4, W*0.85, 55, 32);
  moonGrad.addColorStop(0, '#fffde0');
  moonGrad.addColorStop(0.6, '#f0e090');
  moonGrad.addColorStop(1, '#c8a860');
  ctx.fillStyle = moonGrad;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#ffe090';
  ctx.fill();
  ctx.shadowBlur = 0;
  // Craters
  [[W*0.85-10, 50, 4], [W*0.85+8, 60, 3], [W*0.85-2, 65, 2.5]].forEach(([cx,cy,cr]) => {
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(140,100,40,0.35)';
    ctx.fill();
  });
  ctx.restore();
}

function drawWindParticles() {
  if (Math.abs(state.wind) < 0.5) return;
  const strength = Math.abs(state.wind) / 10;
  for (const p of state.windParticles) {
    p.x += p.speed * Math.abs(state.wind) * 0.4;
    if (state.wind < 0) p.x -= p.speed * Math.abs(state.wind) * 0.8;
    if ((state.wind >= 0 && p.x > W+40) || (state.wind < 0 && p.x < -40)) {
      Object.assign(p, newWindParticle(false));
    }
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + (state.wind > 0 ? p.len : -p.len), p.y);
    ctx.strokeStyle = `rgba(180,220,255,${p.alpha * strength})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawGround() {
  const grad = ctx.createLinearGradient(0, GY, 0, H);
  grad.addColorStop(0, '#1a2a1a');
  grad.addColorStop(0.3, '#0f1f0f');
  grad.addColorStop(1, '#080f08');
  ctx.fillStyle = grad;
  ctx.fillRect(0, GY, W, H-GY);

  // Road markings
  ctx.strokeStyle = 'rgba(255,255,100,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(0, GY + 12);
  ctx.lineTo(W, GY + 12);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBuilding(bld) {
  const { x, y, w, h, type, wins, roofFeatures, damages } = bld;

  // Main facade
  let facade;
  if (type === 0) { // glass
    facade = ctx.createLinearGradient(x, y, x+w, y);
    facade.addColorStop(0, '#1a2a3a');
    facade.addColorStop(0.5, '#243550');
    facade.addColorStop(1, '#1a2a3a');
  } else if (type === 1) { // concrete
    facade = ctx.createLinearGradient(x, y, x+w, y+h);
    facade.addColorStop(0, '#2a2a30');
    facade.addColorStop(1, '#1a1a20');
  } else { // brick
    facade = ctx.createLinearGradient(x, y, x, y+h);
    facade.addColorStop(0, '#3a1a10');
    facade.addColorStop(0.5, '#2a1208');
    facade.addColorStop(1, '#1a0a04');
  }
  ctx.fillStyle = facade;
  ctx.fillRect(x, y, w, h);

  // Outline
  ctx.strokeStyle = type === 0 ? 'rgba(60,120,160,0.5)' : type === 1 ? 'rgba(80,80,100,0.4)' : 'rgba(80,40,20,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // Windows
  for (const win of wins) {
    const wx = x + win.bx, wy = y + win.by;
    if (wy + win.bh < y || wy > y + h) continue;
    ctx.fillStyle = win.lit
      ? win.litColor
      : (type === 0 ? 'rgba(10,30,60,0.8)' : 'rgba(0,0,0,0.6)');
    if (win.arch) {
      ctx.beginPath();
      ctx.moveTo(wx, wy + win.bh);
      ctx.lineTo(wx, wy + win.bh * 0.4);
      ctx.quadraticCurveTo(wx + win.bw/2, wy, wx + win.bw, wy + win.bh * 0.4);
      ctx.lineTo(wx + win.bw, wy + win.bh);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(wx, wy, win.bw, win.bh);
    }
    if (win.lit) {
      const glow = ctx.createRadialGradient(wx+win.bw/2, wy+win.bh/2, 0, wx+win.bw/2, wy+win.bh/2, win.bw);
      glow.addColorStop(0, win.litColor.replace(')', ',0.15)').replace('hsl', 'hsla'));
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(wx-4, wy-4, win.bw+8, win.bh+8);
    }
  }

  // Roof features
  for (const feat of roofFeatures) {
    const fx = x + feat.x, fy = y + feat.y;
    if (feat.type === 'tower') {
      ctx.fillStyle = '#1a1a2a';
      ctx.fillRect(fx, fy, feat.w, feat.h);
      ctx.strokeStyle = 'rgba(60,80,120,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(fx, fy, feat.w, feat.h);
    } else if (feat.type === 'antenna') {
      ctx.strokeStyle = 'rgba(150,150,180,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + feat.x, fy + feat.h);
      ctx.lineTo(x + feat.x, fy);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + feat.x, fy, 2, 0, Math.PI*2);
      ctx.fillStyle = '#f44';
      ctx.fill();
    } else if (feat.type === 'vent') {
      ctx.fillStyle = '#252530';
      ctx.fillRect(fx, fy, feat.w, feat.h);
    }
  }

  // Damage zones
  for (const dmg of damages) {
    drawDamageZone(dmg.x, dmg.y, dmg, type);
  }
}

function drawDamageZone(cx, cy, dmg, btype) {
  const { r, jagged, cracks, scorches } = dmg;
  const pts = jagged.length;

  // Dark hole
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const rr = r * jagged[i];
    const px = cx + Math.cos(a) * rr;
    const py = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = '#060412';
  ctx.fill();

  // Inner heat glow
  const firePhase = Math.sin(state.frame * 0.1) * 0.5 + 0.5;
  if (dmg.hits > 0) {
    const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.6);
    ig.addColorStop(0, `rgba(255,${80+firePhase*60},0,${0.15+firePhase*0.1})`);
    ig.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ig;
    ctx.beginPath();
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const rr = r * jagged[i] * 0.9;
      const px = cx + Math.cos(a) * rr;
      const py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Scorch marks
  for (const s of scorches) {
    ctx.beginPath();
    ctx.arc(cx + s.ox, cy + s.oy, s.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fill();
  }

  // Cracks
  ctx.strokeStyle = 'rgba(200,180,100,0.5)';
  ctx.lineWidth = 1;
  for (const crack of cracks) {
    if (!crack.length) continue;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    for (const pt of crack) ctx.lineTo(cx + pt.x, cy + pt.y);
    ctx.stroke();
  }

  // Animated embers
  if (state.frame % 4 === 0 && dmg.hits > 0) {
    for (let i = 0; i < 2; i++) {
      const a = Math.random()*Math.PI*2;
      const dist = Math.random()*r*0.6;
      state.particles.push({
        x: cx + Math.cos(a)*dist,
        y: cy + Math.sin(a)*dist,
        vx: (Math.random()-0.5)*0.5,
        vy: -(0.5 + Math.random()),
        life: 0.6 + Math.random()*0.3,
        maxLife: 1,
        r: 1 + Math.random()*1.5,
        kind: 'fire',
      });
    }
  }

  ctx.restore();
}

function drawGorilla(gx, gy, playerIdx, armRaised) {
  const scale = 1;
  ctx.save();
  ctx.translate(gx, gy);

  // Shadow
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();

  // Legs
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(-11, -26, 10, 20);
  ctx.fillRect(2, -26, 10, 20);

  // Feet
  ctx.beginPath();
  ctx.ellipse(-6, -7, 7, 5, 0.3, 0, Math.PI*2);
  ctx.fillStyle = '#1a0d04';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(7, -7, 7, 5, -0.3, 0, Math.PI*2);
  ctx.fill();

  // Body
  const bodyGrad = ctx.createRadialGradient(-4, -38, 4, 0, -40, 22);
  bodyGrad.addColorStop(0, '#5a3a1a');
  bodyGrad.addColorStop(0.5, '#3a2010');
  bodyGrad.addColorStop(1, '#1a0d04');
  ctx.beginPath();
  ctx.ellipse(0, -44, 18, 22, 0, 0, Math.PI*2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Saddle (silverback)
  ctx.beginPath();
  ctx.ellipse(0, -44, 10, 14, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(220,210,190,0.18)';
  ctx.fill();

  // Arms
  if (armRaised) {
    // Throwing arm
    const dir = playerIdx === 0 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(dir * 14, -58);
    ctx.quadraticCurveTo(dir * 32, -72, dir * 28, -50);
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#3a2010';
    ctx.stroke();
    // Other arm
    ctx.beginPath();
    ctx.moveTo(-dir * 14, -56);
    ctx.quadraticCurveTo(-dir * 22, -44, -dir * 18, -34);
    ctx.lineWidth = 8;
    ctx.stroke();
  } else {
    // Both arms down
    ctx.beginPath();
    ctx.moveTo(14, -56);
    ctx.quadraticCurveTo(26, -48, 22, -34);
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#3a2010';
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-14, -56);
    ctx.quadraticCurveTo(-26, -48, -22, -34);
    ctx.lineWidth = 9;
    ctx.stroke();
  }

  // Knuckles
  [[16,-54],[-16,-54]].forEach(([kx,ky]) => {
    ctx.beginPath();
    ctx.arc(kx, ky, 4, 0, Math.PI*2);
    ctx.fillStyle = '#2a1a0a';
    ctx.fill();
  });

  // Head
  const headGrad = ctx.createRadialGradient(-4, -66, 4, 0, -65, 16);
  headGrad.addColorStop(0, '#5a3a1a');
  headGrad.addColorStop(0.6, '#3a2010');
  headGrad.addColorStop(1, '#1a0d04');
  ctx.beginPath();
  ctx.ellipse(0, -65, 15, 14, 0, 0, Math.PI*2);
  ctx.fillStyle = headGrad;
  ctx.fill();

  // Brow ridge
  ctx.beginPath();
  ctx.ellipse(0, -72, 13, 4, 0, 0, Math.PI*2);
  ctx.fillStyle = '#1a0d04';
  ctx.fill();

  // Eyes
  [[-6, -68], [6, -68]].forEach(([ex, ey]) => {
    ctx.beginPath();
    ctx.arc(ex, ey, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex + 0.5, ey, 1.8, 0, Math.PI*2);
    ctx.fillStyle = '#1a0808';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex + 0.8, ey - 0.6, 0.6, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  });

  // Broad nose
  ctx.beginPath();
  ctx.ellipse(0, -63, 5.5, 4, 0, 0, Math.PI*2);
  ctx.fillStyle = '#2a1208';
  ctx.fill();
  [-3, 3].forEach(nx => {
    ctx.beginPath();
    ctx.arc(nx, -62, 2, 0, Math.PI*2);
    ctx.fillStyle = '#160804';
    ctx.fill();
  });

  // Mouth
  ctx.beginPath();
  ctx.arc(0, -59, 5, 0.1, Math.PI - 0.1);
  ctx.strokeStyle = '#160804';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();

  // HP hearts on canvas above gorilla
  const hpY = gy - 88;
  const hpX = gx - 20;
  for (let i = 0; i < 3; i++) {
    ctx.font = '14px serif';
    ctx.globalAlpha = i < state.hp[playerIdx] ? 1.0 : 0.25;
    ctx.fillStyle = '#ff4466';
    ctx.fillText('❤', hpX + i*18, hpY);
  }
  ctx.globalAlpha = 1;

  // Player label
  ctx.fillStyle = playerIdx === 0 ? '#8de' : '#fda';
  ctx.font = 'bold 10px Rajdhani';
  ctx.textAlign = 'center';
  ctx.fillText('P' + (playerIdx+1), gx, gy - 92);
  ctx.textAlign = 'left';
}

function drawBanana(bx, by, rot, scale) {
  scale = scale || 1;
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  const layers = [
    { width: 7, color: '#7a5000' },
    { width: 5.5, color: '#c07800' },
    { width: 4, color: '#ffe030' },
    { width: 2.5, color: '#fff080' },
    { width: 1, color: 'rgba(255,255,220,0.8)' },
  ];
  for (const layer of layers) {
    ctx.beginPath();
    ctx.moveTo(-10, 3);
    ctx.quadraticCurveTo(0, -14, 10, 3);
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = layer.width;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-10, 3, 2.5, 0, Math.PI*2);
    ctx.arc(10, 3, 2.5, 0, Math.PI*2);
    ctx.fillStyle = layer.color;
    ctx.fill();
  }
  ctx.restore();
}

function drawTrail(trail, alpha) {
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const r = 4 * t;
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,200,30,${t * alpha * 0.5})`;
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of state.particles) {
    const t = p.life / (p.maxLife || 1);
    if (p.kind === 'fire') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,${120+t*120},${t*50},${t})`;
      ctx.fill();
    } else if (p.kind === 'smoke') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(80,80,100,${t*0.4})`;
      ctx.fill();
    } else if (p.kind === 'debris') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.color || '#604020';
      ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r);
      ctx.restore();
    } else if (p.kind === 'flash') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,200,${t*0.6})`;
      ctx.fill();
    }
  }
}

function drawShockwaves() {
  for (const sw of state.shockwaves) {
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,200,80,${sw.alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawHitFlash() {
  if (!state.hitFlash || state.hitFlash.timer <= 0) return;
  const gor = state.gorillas[state.hitFlash.playerIdx];
  const alpha = state.hitFlash.timer / 20;
  ctx.beginPath();
  ctx.arc(gor.x, gor.y - 35, 32, 0, Math.PI*2);
  ctx.fillStyle = `rgba(255,0,0,${alpha * 0.5})`;
  ctx.fill();
  state.hitFlash.timer--;
  if (state.hitFlash.timer <= 0) state.hitFlash = null;
}

function drawScreenFlash() {
  if (state.screenFlash <= 0) return;
  ctx.fillStyle = `rgba(255,255,255,${state.screenFlash * 0.7})`;
  ctx.fillRect(0, 0, W, H);
  state.screenFlash = Math.max(0, state.screenFlash - 0.06);
}

function drawTrajectory() {
  if (!state.showTrajectory || state.phase !== 'input') return;
  const pts = getTrajectoryPoints();
  if (pts.length < 2) return;
  const wIdx = state.selectedWeapon[state.current];
  const weapon = WEAPONS[wIdx];

  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.lineWidth = 1.5;
  for (let i = 0; i < pts.length - 1; i++) {
    const t = i / pts.length;
    ctx.strokeStyle = `rgba(255,220,80,${0.7 - t * 0.5})`;
    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    ctx.lineTo(pts[i+1].x, pts[i+1].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // Landing splash circle
  const last = pts[pts.length-1];
  const splashR = weapon.splashR * (weapon.id === 2 ? 2 : 1);
  ctx.beginPath();
  ctx.arc(last.x, last.y, splashR, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(255,100,100,0.6)`;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function render() {
  // Camera shake
  const cam = state.camera;
  if (cam.shakeTimer > 0) {
    cam.shakeX = (Math.random()-0.5) * cam.shakeIntensity * (cam.shakeTimer / cam.shakeDuration);
    cam.shakeY = (Math.random()-0.5) * cam.shakeIntensity * (cam.shakeTimer / cam.shakeDuration);
    cam.shakeTimer--;
  } else {
    cam.shakeX = 0; cam.shakeY = 0;
  }

  ctx.save();
  ctx.translate(cam.shakeX, cam.shakeY);

  drawSky();
  drawWindParticles();

  // Draw trajectory before buildings so it shows behind
  drawTrajectory();

  // Buildings
  for (const bld of state.buildings) drawBuilding(bld);

  drawGround();
  drawShockwaves();
  drawParticles();

  // Gorillas
  for (let i = 0; i < 2; i++) {
    const armRaised = state.phase === 'input' && state.current === i;
    drawGorilla(state.gorillas[i].x, state.gorillas[i].y, i, armRaised);
  }

  drawHitFlash();

  // Banana & trail
  if (state.banana) {
    drawTrail(state.banana.trail, 1.0);
    const bscale = state.banana.weapon.id === 2 ? 1.6 : 1.0;
    drawBanana(state.banana.x, state.banana.y, state.banana.rot, bscale);
  }

  // Cluster bananas
  for (const cb of state.clusterBananas) {
    drawTrail(cb.trail, 0.7);
    drawBanana(cb.x, cb.y, cb.rot, 0.7);
  }

  drawScreenFlash();

  ctx.restore();
}

function gameLoop() {
  state.frame++;
  if (state.phase === 'flying') updateBanana();
  if (state.clusterBananas.length > 0) {
    updateClusterBananas();
    if (state.clusterBananas.length === 0 && !state.banana && state.phase === 'flying') {
      state.phase = 'input';
      setTimeout(() => { playMiss(); missTurn(); }, 400);
    }
  }
  emitDamageSmoke();
  updateParticles();
  render();
  requestAnimationFrame(gameLoop);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('click', () => getAudio(), { once: true });
  updateControls();
  initState();
  startTimer();
  updateMessage();
  gameLoop();
});
</script>
</body>
